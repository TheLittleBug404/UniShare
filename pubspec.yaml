name: uni_share
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  change_app_package_name: ^1.5.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_form_builder: ^10.2.0
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  flutter_spinkit: ^5.2.2
  form_builder_validators: ^11.2.0
  get: ^4.7.2
  google_fonts: ^6.3.2
  google_sign_in: ^7.2.0
  loading_overlay: ^0.5.0
  sign_in_button: ^4.0.1
  supabase_flutter: ^2.10.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios : true
  image_path: "assets/img/logo_unishare.webp"

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - .env
